<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Console - เข้าสู่ระบบ</title>
    <!-- Prompt Font & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Universal Theme Manager & API Config -->
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <script src="config.js"></script>

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #141b2a;
            --bg-input: #101626;
            --border-color: #2d3852;
            --text-title: #f9fafb;
            --text-body: #cbd5e1;
            --text-muted: #808c9f;
            --accent-blue: var(--primary-color, #2563eb);
            --accent-blue-hover: var(--primary-hover, #1d4ed8);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body.light-mode,
        html.light-theme {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --border-color: #cbd5e1;
            --text-title: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family-base, 'Prompt', sans-serif);
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-body);
            min-height: 100vh;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            position: relative;
            padding: 24px 16px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Glow Background Effects */
        .glow-bg {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .glow-bg-bottom {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        /* Theme Toggle Button */
        .btn-theme-toggle {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-body);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .btn-theme-toggle:hover {
            color: var(--text-title);
            border-color: var(--accent-blue);
        }

        /* Login Card Container */
        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: var(--shadow-lg);
            z-index: 1;
            position: relative;
        }

        /* ── Login Header: High-specificity rules scoped to .login-card ── */
        /* These override any global theme.css .brand-header rules */
        .login-card .brand-header {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            margin-bottom: 28px !important;
            width: 100% !important;
            height: auto !important;
            min-height: auto !important;
            padding: 0 !important;
            border-bottom: none !important;
            box-sizing: border-box !important;
            gap: 8px !important;
        }

        /* Title text */
        .login-card .brand-title {
            font-size: 1.85rem !important;
            font-weight: 800 !important;
            color: var(--text-title) !important;
            letter-spacing: -0.5px !important;
            line-height: 1.2 !important;
            margin: 0 !important;
            text-align: center !important;
        }

        /* Subtitle */
        .login-card .brand-subtitle {
            font-size: 0.88rem !important;
            color: var(--text-muted) !important;
            margin: 0 !important;
            line-height: 1.5 !important;
            word-break: break-word !important;
            text-align: center !important;
            width: 100% !important;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
                align-items: flex-start;
                padding-top: 60px;
            }

            .login-card {
                padding: 24px 18px;
                border-radius: 12px;
                max-width: 100%;
            }

            .login-card .brand-header {
                margin-bottom: 20px !important;
                gap: 6px !important;
            }

            .login-card .brand-title {
                font-size: 1.5rem !important;
            }

            .login-card .brand-subtitle {
                font-size: 0.8rem !important;
            }

            .oauth-login-buttons {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-title);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px 12px 42px;
            color: var(--text-title);
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Password Toggle Eye Icon */
        .toggle-password {
            position: absolute;
            right: 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
        }

        .toggle-password:hover {
            color: var(--text-title);
        }

        /* Remember & Options Row */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-body);
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            accent-color: var(--accent-blue);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--accent-blue);
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background-color: var(--primary-color, #2563eb);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--primary-light, rgba(37, 99, 235, 0.25));
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover, #1d4ed8);
            box-shadow: 0 6px 16px var(--primary-glow, rgba(37, 99, 235, 0.35));
        }

        /* OAuth Social Login */
        .oauth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0 16px 0;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .oauth-divider::before, .oauth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .oauth-divider span {
            padding: 0 12px;
        }

        .oauth-login-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
        }

        .btn-oauth-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 0.92rem;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn-oauth-google:hover {
            border-color: #ea4335;
            color: #ea4335;
            background-color: rgba(234, 67, 53, 0.08);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(234, 67, 53, 0.12);
        }

        /* Footer Info */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
    </style>
</head>

<body>

    <!-- Glow Backdrops -->
    <div class="glow-bg"></div>
    <div class="glow-bg-bottom"></div>

    <!-- Theme Switcher & Color Picker Controls -->
    <div style="position: absolute; top: 24px; right: 24px; display: flex; align-items: center; gap: 8px; z-index: 100;">
        <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="สลับธีม สว่าง/มืด">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <!-- Login Container Box -->
    <div class="login-card">
        <div class="brand-header">
            <h1 class="brand-title">Asset Console</h1>
            <p class="brand-subtitle">ระบบบริหารจัดการทรัพย์สินองค์กร Enterprise v3.4</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">ชื่อผู้ใช้งาน หรือ อีเมล</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" class="form-control" placeholder="เช่น admin@company.com" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">รหัสผ่าน</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePasswordBtn"
                        onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>จดจำรหัสผ่านไว้</span>
                </label>
                <a href="#" class="forgot-link"
                    onclick="alert('กรุณาติดต่อผู้ดูแลระบบ IT Support เพื่อรีเซ็ตรหัสผ่าน')">ลืมรหัสผ่าน?</a>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
            </button>

            <div class="oauth-divider">
                <span>หรือเข้าสู่ระบบด้วย</span>
            </div>

            <div class="oauth-login-buttons">
                <a href="/api/auth/google?return_to=/dashboard.html" class="btn-oauth-google" id="btnGoogleLogin">
                    <i class="fa-brands fa-google" style="color:#ea4335; font-size: 1.05rem;"></i> เข้าสู่ระบบด้วย Google
                </a>
            </div>
        </form>

        <div class="login-footer">
            &copy; 2026 Asset Console Enterprise Edition. All rights reserved.
        </div>
    </div>

    <!-- JavaScript Functions -->
    <script>
        // 1. ฟังก์ชันสำหรับการเข้าสู่ระบบและการจดจำรหัสผ่าน (Remember Me)
        async function handleLogin(e) {
            e.preventDefault();

            const btn = document.querySelector('.btn-submit');
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const rememberMeChecked = document.getElementById('rememberMe').checked;

            if (!usernameInput || !passwordInput) {
                showError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
                return;
            }

            // UI: Loading state
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ...';
            hideError();

            try {
                const r = await fetch(getApiUrl('/api/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });
                const data = await r.json();

                if (r.ok && data.success) {
                    // Save token
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('auth_user', JSON.stringify(data.user));

                    if (rememberMeChecked) {
                        localStorage.setItem('saved_username', usernameInput);
                        localStorage.setItem('remember_me', 'true');
                    } else {
                        localStorage.removeItem('saved_username');
                        localStorage.removeItem('remember_me');
                    }

                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    showError(data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ';
                }
            } catch (err) {
                showError('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ';
            }
        }

        function showError(msg) {
            let el = document.getElementById('loginError');
            if (!el) {
                el = document.createElement('div');
                el.id = 'loginError';
                el.style.cssText = 'background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;';
                const form = document.getElementById('loginForm');
                form.insertBefore(el, form.firstChild);
            }
            el.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${msg}`;
            el.style.display = 'flex';
        }

        function hideError() {
            const el = document.getElementById('loginError');
            if (el) el.style.display = 'none';
        }


        // 2. ฟังก์ชันซ่อน/แสดงรหัสผ่าน
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePasswordBtn');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.className = 'fa-solid fa-eye-slash toggle-password';
            } else {
                passwordInput.type = 'password';
                toggleBtn.className = 'fa-solid fa-eye toggle-password';
            }
        }

        // ── Theme: จัดการโดย theme.js กลางใน <head> (window.toggleTheme) ──

        // 4. โหลดข้อมูลเมื่อเปิดหน้าเว็บ (ดึงรหัสผ่านที่เคยจำไว้)
        window.onload = async function () {
            // ปรับแต่งลิงก์ OAuth ให้ชี้ไปยัง Backend Server ตาม API_BASE_URL
            const clientOriginParam = `&client_origin=${encodeURIComponent(window.location.origin)}`;
            const googleBtn = document.getElementById('btnGoogleLogin');
            if (googleBtn) googleBtn.href = getApiUrl(`/api/auth/google?return_to=/dashboard.html${clientOriginParam}`);

            // ตรวจสอบ query string สำหรับ OAuth callback และข้อผิดพลาด
            const params = new URLSearchParams(window.location.search);
            const oauthToken = params.get('oauth_token');
            const oauthError = params.get('error');

            if (oauthToken) {
                localStorage.setItem('auth_token', oauthToken);
                try {
                    const r = await fetch(getApiUrl('/api/me'), { headers: { Authorization: `Bearer ${oauthToken}` } });
                    if (r.ok) {
                        const data = await r.json();
                        localStorage.setItem('auth_user', JSON.stringify(data.user));
                    }
                } catch(e) {}
                window.location.href = 'dashboard.html';
                return;
            }

            if (oauthError) {
                const errorMsgMap = {
                    google_oauth_not_configured: 'Google OAuth ยังไม่ได้ตั้งค่า (โปรดใส่ GOOGLE_CLIENT_ID และ GOOGLE_CLIENT_SECRET ใน oauth.config.js หรือไฟล์ .env)',
                    oauth_disabled: 'ระบบ Social Login ยังไม่ได้ตั้งค่า Client ID / Secret ใน oauth.config.js หรือไฟล์ .env',
                    oauth_failed:   'การเข้าสู่ระบบผ่านผู้ให้บริการภายนอกไม่สำเร็จ',
                    token_failed:   'ไม่สามารถยืนยันตัวตนกับผู้ให้บริการ OAuth ได้',
                    no_code:        'ไม่พบรหัสยืนยันตัวตนจากผู้ให้บริการ'
                };
                showError(errorMsgMap[oauthError] || `เกิดข้อผิดพลาด (${oauthError}) กรุณาลองใหม่อีกครั้ง`);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            // ถ้ามี token ให้ตรวจสอบ session ก่อน – ถ้ายังใช้ได้ให้ redirect ไป dashboard
            const token = localStorage.getItem('auth_token');
            if (token) {
                try {
                    const r = await fetch(getApiUrl('/api/me'), { headers: { 'Authorization': `Bearer ${token}` } });
                    if (r.ok) {
                        window.location.href = 'dashboard.html';
                        return;
                    }
                } catch(e) {}
                // Token หมดอายุ – ลบออก
                localStorage.removeItem('auth_token');
                localStorage.removeItem('auth_user');
            }

            // ดึงข้อมูล Remember Me (ชื่อผู้ใช้เท่านั้น ไม่เก็บรหัสผ่าน)
            const isRemembered = localStorage.getItem('remember_me') === 'true';
            if (isRemembered) {
                document.getElementById('username').value = localStorage.getItem('saved_username') || '';
                document.getElementById('rememberMe').checked = true;
            }
        };

    </script>
</body>

</html>
